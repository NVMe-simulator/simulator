set noparent
linelength=120
extensions=cc,cpp,cxx,h,hh,hpp,hxx
# Legal notices are not a code-style requirement. TODO ownership is optional.
# clang-format owns indentation: cpplint hardcodes Google's 2-space rules.
# clang-format owns include order: project headers may use <>.
# Quoted basename includes are allowed for headers in the same directory.
filter=-legal/copyright,-readability/todo,-whitespace/indent,-build/include_order,-build/include_subdir
